name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_GENERATOR: Ninja
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  build-and-test:
    name: ${{ matrix.compiler.name }} / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    container: fedora:42
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: GCC
            cc: gcc
          - name: Clang
            cc: clang
        build_type: [Debug, Release]
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y \
            cmake \
            ninja-build \
            git \
            gcc \
            gcc-c++ \
            clang \
            clang-tools-extra \
            compiler-rt \
            libasan \
            libubsan \
            lmdb-devel
          dnf clean all

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }} \
            -DLSQL_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ${{ matrix.compiler.name }} / ASan + UBSan
    runs-on: ubuntu-24.04
    container: fedora:42
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: GCC
            cc: gcc
          - name: Clang
            cc: clang
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Install sanitizer toolchain
        run: |
          dnf install -y \
            cmake \
            ninja-build \
            git \
            gcc \
            gcc-c++ \
            clang \
            clang-tools-extra \
            compiler-rt \
            libasan \
            libubsan \
            lmdb-devel
          dnf clean all

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.compiler.cc }} \
            -DLSQL_WARNINGS_AS_ERRORS=ON \
            -DLSQL_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - name: Install analysis toolchain
        run: |
          dnf install -y \
            cmake \
            ninja-build \
            git \
            gcc \
            gcc-c++ \
            clang \
            clang-tools-extra \
            cppcheck \
            lmdb-devel
          dnf clean all

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DLSQL_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Check formatting
        run: clang-format --dry-run --Werror $(git ls-files '*.c' '*.h')

      - name: Run clang-tidy
        run: clang-tidy -p build --quiet --warnings-as-errors='*' src/*.c tools/*.c tests/*.c

      - name: Run Cppcheck
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            --std=c23 \
            --check-level=exhaustive \
            --quiet \
            -Iinclude \
            -Isrc \
            src tools tests
